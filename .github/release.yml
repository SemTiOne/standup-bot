changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
  categories:
    - title: "Breaking Changes"
      labels:
        - breaking-change
    - title: "New Features"
      labels:
        - feature
        - enhancement
    - title: "Bug Fixes"
      labels:
        - fix
        - bug
    - title: "Security"
      labels:
        - security
    - title: "Documentation"
      labels:
        - documentation
        - docs
    - title: "Other Changes"
      labels:
        - "*"
