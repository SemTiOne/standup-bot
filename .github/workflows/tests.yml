name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.4.4,<1.0.0"
      - name: Lint
        run: ruff check standup/ tests/ setup.py
      - name: Format check
        run: ruff format --check standup/ tests/ setup.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy and stubs
        run: pip install "mypy>=1.10.0,<2.0.0" types-requests
      - name: Run mypy
        # mypy >= 1.10 dropped Python 3.9 as a target; 3.10 is the minimum.
        # 3.10 is the minimum supported runtime version.
        run: mypy standup/ --ignore-missing-imports --python-version 3.10

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit>=1.7.8,<2.0.0"
      - name: Run bandit
        run: bandit -r standup/ -ll

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit>=2.7.3,<3.0.0"
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, type-check, security-scan, dependency-audit]
    strategy:
      fail-fast: false
      matrix:
        # 3.9 removed: dropped from python_requires in setup.py. 3.10 is the minimum.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=standup --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: matrix.python-version == '3.12' && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
