# ruff.toml — standalone config (NOT pyproject.toml format)
# https://docs.astral.sh/ruff/configuration/#ruff-toml

target-version = "py39"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "S101",  # assert statements — used extensively in tests
    "S603",  # subprocess call — used in git_reader for git operations
    "S607",  # partial executable path — used in git_reader
    "B008",  # function call in argument defaults — needed in validators
    "UP006", # keep Optional[X] for Python 3.9 compatibility
    "UP007", # keep Union[X, Y] for Python 3.9 compatibility
    "UP035", # keep typing module imports for Python 3.9 compatibility
    "N802",  # function name should be lowercase — some test helpers use UPPER
    # E501: long lines are intentional in user-facing strings, argparse help
    # text, regex patterns, and XML/plist templates. Wrapping them reduces
    # readability without improving correctness or security.
    "E501",
]

[lint.per-file-ignores]
"tests/*" = ["S", "N"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"